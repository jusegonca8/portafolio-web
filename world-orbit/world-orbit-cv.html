<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Juan Sebastián González Castellanos | Portafolio</title>
<meta name="description" content="Juan Sebastián González Castellanos, PMP® — Senior Technical Project Manager & AI Product Manager. Carrusel 3D de proyectos destacados." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="world-orbit-cv.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
</head>
<body>

<div id="tsparticles" aria-hidden="true"></div>

<div class="shell">
  <header class="masthead">
    <h1>Juan Sebastián González Castellanos</h1>
    <p class="eyebrow">Scroll para conocerme</p>
  </header>

  <div class="stage" id="stage">
    <button class="arrow prev" id="prev" aria-label="Proyecto anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="arrow next" id="next" aria-label="Siguiente proyecto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <div class="controls">
    <button class="cta" id="cta">
      <span id="ctaLabel">Explorar</span>
      <span class="arrow-glyph">↗</span>
    </button>
    <div class="dots" id="dots" role="tablist" aria-label="Proyectos"></div>
    <div class="readout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
      <span class="place" id="roPlace">—</span>
      <span><span class="k">Stack</span><span class="v" id="roStack">—</span></span>
      <span><span class="k">Rol</span><span class="v" id="roRole">—</span></span>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <button class="close" id="close" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <div class="sheet-scroll">
    <div class="sheet-hero">
      <div class="media" id="sheetMedia"></div>
      <div class="veil"></div>
      <div class="head">
        <div class="geo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
          <span id="sheetGeo"></span>
        </div>
        <h2 id="sheetTitle"></h2>
        <p class="tag" id="sheetTag"></p>
      </div>
    </div>
    <div class="sheet-body">
      <p class="lede" id="sheetLede"></p>
      <div class="section-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg>
        <span>Aspectos técnicos</span>
      </div>
      <div class="grid" id="sheetGrid"></div>
    </div>
  </div>
</div>

<script src="world-orbit-cv.js"></script>
</body>
</html>
